              - { label: 流程区标签, name: stepsEyebrow, widget: string }
              - { label: 流程区标题, name: stepsTitle, widget: text }
              - { label: 流程区按钮, name: stepsCta, widget: string }
              - { label: 步骤 1 标题, name: step1Title, widget: string }
              - { label: 步骤 1 正文, name: step1Body, widget: text }
              - { label: 步骤 2 标题, name: step2Title, widget: string }
