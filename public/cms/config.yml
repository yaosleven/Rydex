              - { label: 车型卡片 4 引擎, name: model4Engine, widget: string }
              - { label: 优势区标签, name: benefitsEyebrow, widget: string }
              - { label: 优势区标题, name: benefitsTitle, widget: text }
              - { label: 优势 1 标题, name: benefit1Title, widget: string }
              - { label: 优势 1 正文, name: benefit1Body, widget: text }
              - { label: 优势 2 标题, name: benefit2Title, widget: string }
              - { label: 优势 2 正文, name: benefit2Body, widget: text }
