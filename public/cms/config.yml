              - { label: 评价区标签, name: testimonialsEyebrow, widget: string }
              - { label: 评价区标题, name: testimonialsTitle, widget: text }
              - { label: 评价内容, name: testimonialQuote, widget: text }
              - { label: 评价 1 姓名, name: testimonial1Name, widget: string }
              - { label: 评价 1 地区, name: testimonial1Location, widget: string }
              - { label: 评价 2 姓名, name: testimonial2Name, widget: string }
              - { label: 评价 2 地区, name: testimonial2Location, widget: string }
              - { label: 评价 3 姓名, name: testimonial3Name, widget: string }
              - { label: 评价 3 地区, name: testimonial3Location, widget: string }
              - { label: 评价 4 姓名, name: testimonial4Name, widget: string }
              - { label: 评价 4 地区, name: testimonial4Location, widget: string }
              - { label: 评价 5 姓名, name: testimonial5Name, widget: string }
              - { label: 评价 5 地区, name: testimonial5Location, widget: string }
              - { label: 评价 6 姓名, name: testimonial6Name, widget: string }
              - { label: 评价 6 地区, name: testimonial6Location, widget: string }
              - { label: 评价 7 姓名, name: testimonial7Name, widget: string }
              - { label: 评价 7 地区, name: testimonial7Location, widget: string }
              - { label: 评价 8 姓名, name: testimonial8Name, widget: string }
              - { label: 评价 8 地区, name: testimonial8Location, widget: string }
              - { label: 评价 9 姓名, name: testimonial9Name, widget: string }
              - { label: 评价 9 地区, name: testimonial9Location, widget: string }
              - { label: 评价 10 姓名, name: testimonial10Name, widget: string }
              - { label: 评价 10 地区, name: testimonial10Location, widget: string }
